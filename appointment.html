<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WanderLux | Book Appointment</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <div class="logo">WanderLux <span>Travel</span></div>
      <div class="menu-icon" id="menuToggle">
        <i class="fas fa-bars"></i>
      </div>
      <ul class="nav-links" id="navLinks">
        <li><a href="index.html">Home</a></li>
        <li><a href="services.html">Destinations</a></li>
        <li><a href="calculator.html">Calculator</a></li>
        <li><a href="appointment.html">Appointment</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </div>
  </nav>

  <main>
    <div class="container" style="max-width: 700px;">
      <h2 class="section-title">Schedule a Consultation</h2>
      <form id="appointmentForm" style="background: white; padding: 2rem; border-radius: 32px; box-shadow: var(--shadow-sm);">
        <div class="form-group">
          <label>Full Name *</label>
          <input type="text" id="name" placeholder="John Doe">
        </div>
        <div class="form-group">
          <label>Email Address *</label>
          <input type="email" id="email" placeholder="hello@wanderlux.com">
        </div>
        <div class="form-group">
          <label>Phone Number *</label>
          <input type="tel" id="phone" placeholder="+1 234 567 8900">
        </div>
        <div class="form-group">
          <label>Preferred Date *</label>
          <input type="date" id="date">
        </div>
        <div class="form-group">
          <label>Your Message *</label>
          <textarea id="message" rows="4" placeholder="Tell us about your dream trip..."></textarea>
        </div>
        <button type="submit" class="btn btn-gold" style="width: 100%;">Request Appointment</button>
      </form>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 WanderLux Travel Agency | Begin Your Journey</p>
  </footer>
  <script src="script.js"></script>
</body>
</html>
