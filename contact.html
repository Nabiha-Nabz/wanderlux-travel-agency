<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WanderLux | Contact Us</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <div class="logo">WanderLux <span>Travel</span></div>
      <div class="menu-icon" id="menuToggle">
        <i class="fas fa-bars"></i>
      </div>
      <ul class="nav-links" id="navLinks">
        <li><a href="index.html">Home</a></li>
        <li><a href="services.html">Destinations</a></li>
        <li><a href="calculator.html">Calculator</a></li>
        <li><a href="appointment.html">Appointment</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </div>
  </nav>

  <main>
    <div class="container">
      <h2 class="section-title">Get In Touch</h2>
      <div class="contact-grid">
        <div class="contact-details">
          <h3><i class="fas fa-map-pin"></i> Visit Us</h3>
          <p><i class="fas fa-building"></i> 123 Luxury Avenue, Manhattan, NY 10001</p>
          <p><i class="fas fa-phone-alt"></i> +1 (888) 555-0123</p>
          <p><i class="fas fa-envelope"></i> hello@wanderlux.com</p>
          <div class="map-container" style="margin-top: 1.5rem;">
            <iframe src="https://maps.google.com/maps?q=Manhattan,New York&z=13&output=embed" allowfullscreen="" loading="lazy"></iframe>
          </div>
        </div>
        <div style="background: white; padding: 1.5rem; border-radius: 28px; box-shadow: var(--shadow-sm);">
          <h3>Send a Message</h3>
          <form id="contactFormSubmit">
            <div class="form-group">
              <label>Your Name *</label>
              <input type="text" id="conName" placeholder="Full name">
            </div>
            <div class="form-group">
              <label>Email *</label>
              <input type="email" id="conEmail" placeholder="you@example.com">
            </div>
            <div class="form-group">
              <label>Message *</label>
              <textarea id="conMsg" rows="4" placeholder="How can we help you?"></textarea>
            </div>
            <button type="submit" class="btn" style="width: 100%;">Send Message</button>
          </form>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 WanderLux Travel Agency | Let's Connect</p>
  </footer>
  <script src="script.js"></script>
</body>
</html>
